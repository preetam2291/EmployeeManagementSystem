<!DOCTYPE html>
<html>

<head>

    <title>Edit Employee</title>

</head>

<body>

    <h1>Edit Employee</h1>

    <form
        action="/update/{{ employee[0] }}"
        method="POST"
    >

        <label>Name:</label>

        <input
            type="text"
            name="name"
            value="{{ employee[1] }}"
            required
        >

        <br><br>


        <label>Age:</label>

        <input
            type="number"
            name="age"
            value="{{ employee[2] }}"
            required
        >

        <br><br>


        <label>Department:</label>

        <input
            type="text"
            name="department"
            value="{{ employee[3] }}"
            required
        >

        <br><br>


        <label>Salary:</label>

        <input
            type="number"
            name="salary"
            value="{{ employee[4] }}"
            required
        >

        <br><br>


        <button type="submit">
            Update Employee
        </button>

    </form>

    <br>

    <a href="/">
        Back to Employee List
    </a>

</body>

</html>
